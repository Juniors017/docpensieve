# Actions are pinned by commit, so that a tag moved upstream cannot change
# what runs here — the workflow that publishes holds an id-token. Pinning
# alone would freeze them; this proposes each new release as a pull request,
# commit and version side by side.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
