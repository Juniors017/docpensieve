name: Deploy

# Once the packages are on npm, never on a push. Deployed on every push, the
# site described what main had done — features no package published under
# `beta` had yet, so a reader following the beta pages got a configuration
# field ignored in silence. Waiting for the publication keeps the pages and
# the packages in step.
#
# After the publication rather than on the release itself: a workflow_run
# runs on main, where the github-pages environment accepts a deployment, and
# builds the site of main even when the release was a fix of an older
# version, cut from its own branch. A fix of the pages alone goes out by hand,
# with "Run workflow" on main.
on:
  workflow_run:
    workflows: ['Publish to npm']
    types: [completed]
  workflow_dispatch:

# Two simultaneous deployments would step on each other, on Pages as well as
# on the orphan branches. The running one is not cancelled: it pushes
# branches, and interrupting it would leave them half written.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A failed publication deploys nothing, and a run started by hand from
    # another branch would push its orphan branches before Pages refused it.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    permissions:
      # Needed to push the orphan branches of the versions.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # A single build produces every version, versions.json and the root
      # redirect. Splitting it into a matrix would run "npm ci" N times for
      # fragments none of which could write the manifest.
      - run: npm run build

      # "checkout" only sets the credentials in the repository it checked out.
      # The script pushes from a temporary clone: without this global rule,
      # git asks for a user name there and fails.
      - name: Let git push from any clone
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"

      - name: Push each version to its orphan branch
        run: node scripts/publish-versions.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
